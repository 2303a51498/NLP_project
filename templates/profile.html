{% extends "base.html" %}{% block title %}Profile | NutriQuery{% endblock %}{% block content %}<section class="panel form-panel"><span class="eyebrow">PERSONALIZATION</span><h1>Your nutrition profile</h1><p>All fields are optional. They help filter dataset examples, not calculate a clinical diet.</p><form method="post" class="form-grid">
<div><label>Age</label><input type="number" name="age" min="1" max="120" value="{{ profile.get('age') or '' }}"></div><div><label>Gender (optional)</label><select name="gender"><option value="">Prefer not to say</option>{% for v in ['Female','Male','Other'] %}<option {{ 'selected' if profile.get('gender')==v else '' }}>{{ v }}</option>{% endfor %}</select></div>
<div><label>Weight (kg)</label><input type="number" step="0.1" name="weight" min="1" max="500" value="{{ profile.get('weight') or '' }}"></div><div><label>Height (cm)</label><input type="number" step="0.1" name="height" min="30" max="260" value="{{ profile.get('height') or '' }}"></div>
<div><label>Diet preference</label><select name="diet_preference"><option value="">Choose</option>{% for v in ['Vegetarian','Non-Vegetarian','Vegan'] %}<option {{ 'selected' if profile.get('diet_preference')==v else '' }}>{{ v }}</option>{% endfor %}</select></div>
<div><label>Health goal</label><select name="health_goal"><option value="">Choose</option>{% for v in ['Weight Loss','Weight Gain','Muscle Gain','General Health','Diabetes-Friendly Eating','Healthy Digestion','Fitness'] %}<option {{ 'selected' if profile.get('health_goal')==v else '' }}>{{ v }}</option>{% endfor %}</select></div>
<div><label>Activity level</label><select name="activity_level"><option value="">Choose</option>{% for v in ['Sedentary','Light','Moderate','Active','Very Active'] %}<option {{ 'selected' if profile.get('activity_level')==v else '' }}>{{ v }}</option>{% endfor %}</select></div>
<div><label>Food allergies (comma-separated)</label><input name="allergies" value="{{ profile.get('allergies') or '' }}" placeholder="e.g. peanut, milk"></div><div class="wide"><button class="btn">Save profile</button></div></form></section>{% endblock %}
